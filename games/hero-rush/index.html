<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070510" />
  <title>히어로러시 - 효종월드</title>
  <link rel="stylesheet" href="./hero-rush.css" />
</head>
<body>
  <main id="heroRushApp" aria-label="히어로러시">
    <div class="mobile-frame">
      <section id="startScreen" class="screen active" aria-label="히어로러시 게임 시작 화면">
        <img class="screen-image" src="./images/hero-rush-start.png" alt="히어로러시 게임 시작 화면" draggable="false" />
        <button id="gameStartBtn" class="image-hitbox start-button-hitbox" type="button" aria-label="게임 시작">
          <span class="sr-only">게임 시작</span>
        </button>
      </section>

      <section id="lobbyScreen" class="screen" aria-label="히어로러시 로비 화면" hidden>
        <img class="screen-image" src="./images/hero-rush-lobby.png" alt="선택된 검사 챔피언이 보이는 히어로러시 로비" draggable="false" />

        <button id="homeBtn" class="image-hitbox lobby-home-hitbox" type="button" aria-label="효종월드 메인으로 돌아가기"></button>
        <button id="settingsBtn" class="image-hitbox lobby-settings-hitbox" type="button" aria-label="설정 열기"></button>
        <button id="menuBtn" class="image-hitbox lobby-menu-hitbox" type="button" aria-label="통합 메뉴 열기"></button>
        <button id="enterBtn" class="image-hitbox lobby-enter-hitbox" type="button" aria-label="스테이지 선택 화면으로 이동"></button>

        <nav id="integratedMenu" class="integrated-menu" aria-label="통합 메뉴">
          <button type="button" data-menu="업적">🏆 <span>업적</span></button>
          <button type="button" data-menu="인벤토리">🎒 <span>인벤토리</span></button>
          <button type="button" data-menu="우편">✉️ <span>우편</span></button>
          <button type="button" data-menu="챔피언">🛡️ <span>챔피언</span></button>
          <button type="button" data-menu="장비">⚔️ <span>장비</span></button>
        </nav>
      </section>

      <section id="stageScreen" class="screen stage-screen" aria-label="스테이지 선택 화면" hidden>
        <div class="stage-header">
          <button id="stageBackBtn" type="button" class="round-button" aria-label="로비로 돌아가기">←</button>
          <h1>스테이지 선택</h1>
          <span class="header-spacer"></span>
        </div>

        <div class="stage-content">
          <button type="button" class="stage-card selected">
            <span class="stage-number">STAGE 1</span>
            <strong>푸른 초원</strong>
            <span>권장 전투력 1,000</span>
          </button>
          <button type="button" class="stage-card locked" disabled>
            <span class="stage-number">STAGE 2</span>
            <strong>잊힌 숲</strong>
            <span>잠김</span>
          </button>
          <button type="button" class="stage-card locked" disabled>
            <span class="stage-number">STAGE 3</span>
            <strong>붉은 협곡</strong>
            <span>잠김</span>
          </button>
        </div>

        <button id="battleStartBtn" type="button" class="battle-start-button">전투 시작</button>
      </section>

      <div id="modalBackdrop" class="modal-backdrop" hidden>
        <section id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
          <div class="modal-title-row">
            <h2 id="settingsTitle">설정</h2>
            <button class="modal-close" type="button" aria-label="설정 닫기">✕</button>
          </div>
          <label class="setting-row"><span>배경음</span><input id="bgmToggle" type="checkbox" checked /></label>
          <label class="setting-row"><span>효과음</span><input id="sfxToggle" type="checkbox" checked /></label>
          <label class="setting-row"><span>자동 공격</span><input id="autoAttackToggle" type="checkbox" /></label>
        </section>

        <section id="infoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden>
          <div class="modal-title-row">
            <h2 id="infoTitle">메뉴</h2>
            <button class="modal-close" type="button" aria-label="메뉴 닫기">✕</button>
          </div>
          <p id="infoText">준비 중인 메뉴입니다.</p>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="./hero-rush.js"></script>
</body>
</html>
